name: Fortran Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested Windows x64 prerelease
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src/**'
      - '__tests__/fortran.test.ts'
      - '__tests__/fixtures/fortran/**'
      - 'scripts/fortran/**'
      - 'third_party/**'
      - 'install.ps1'
      - '.github/workflows/fortran-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Fortran and extraction regression tests
        run: npx vitest run __tests__/fortran.test.ts __tests__/extraction.test.ts __tests__/grammar-wasm-bytes.test.ts __tests__/preload-languages.test.ts __tests__/cross-language-resolution.test.ts --maxWorkers 2 --minWorkers 1
      - name: Get the fixed upstream runtime package
        run: npm pack @colbymchenry/codegraph-win32-x64@1.6.1 --pack-destination "$env:RUNNER_TEMP" --silent
      - name: Build and validate source bundle
        run: node scripts/fortran/build-release.cjs --archive "$env:RUNNER_TEMP\colbymchenry-codegraph-win32-x64-1.6.1.tgz"
      - name: Offline installer acceptance
        run: ./install.ps1 -Archive ./release/fortran/codegraph-fortran-win32-x64.zip -ChecksumFile ./release/fortran/SHA256SUMS -Destination "$env:RUNNER_TEMP\Fortran Chinese 中文\bundle"
      - name: Windows PowerShell 5.1 installer acceptance
        run: node scripts/fortran/check-powershell51.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: codegraph-fortran-windows
          path: release/fortran/*
          if-no-files-found: error
      - name: Publish fork prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'shiysent-ctrl/codegraph-fortran' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" ./release/fortran/codegraph-fortran-win32-x64.zip ./release/fortran/SHA256SUMS ./release/fortran/install.ps1 --target $env:GITHUB_SHA --title "CodeGraph Fortran $version (Windows x64 preview)" --prerelease --notes-file FORTRAN-RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten.' }
